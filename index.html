    // --- RENDER LOGIC FOR SLIDES WITH EXTRA-LARGE TYPOGRAPHY ---
    function renderSlide() {
      const container = document.getElementById('slide-container');
      const data = slideData[currentSlide];

      // Update Counters
      document.getElementById('current-slide-num').innerText = currentSlide + 1;
      document.getElementById('total-slide-num').innerText = slideData.length;
      document.getElementById('canvas-slide-num').innerText = `Slide ${currentSlide + 1} / ${slideData.length}`;
      document.getElementById('progress-bar').style.width = `${((currentSlide + 1) / slideData.length) * 100}%`;
      
      // Disable/Enable Nav buttons
      document.getElementById('txt-prev').parentElement.disabled = (currentSlide === 0);
      document.getElementById('txt-next').parentElement.disabled = (currentSlide === slideData.length - 1);

      // Render Notes Content
      document.getElementById('notes-content').innerHTML = data.notes[currentLang] || data.notes['zh'];

      // Build Slide Content HTML
      let html = '';

      switch (data.id) {
        case 0:
          html = `
            <div class="space-y-8">
              <!-- Slide Header Title Area -->
              <div class="text-center space-y-3">
                <span class="px-4 py-1.5 bg-indigo-100 text-indigo-800 font-extrabold text-sm sm:text-lg rounded-full inline-block border border-indigo-300">
                  ${data.info[currentLang]}
                </span>
                <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight leading-tight">
                  ${data.title[currentLang]}
                </h1>
                <p class="text-xl sm:text-2xl lg:text-3xl text-slate-600 font-bold">
                  ${data.subtitle[currentLang]}
                </p>
              </div>

              <!-- Outcomes Grid -->
              <div class="bg-white rounded-2xl p-6 sm:p-8 border-2 border-slate-200 shadow-md">
                <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-4 flex items-center space-x-3">
                  <span>${data.outcomesTitle[currentLang]}</span>

              <div>
                <label class="block font-black text-slate-900 text-lg sm:text-xl mb-3">1. 選擇主題 Topic Preset</label>
                <div class="grid grid-cols-2 gap-3">
                  ${topicOptions.map(t => `
                    <button onclick="setSlide3Topic('${t.zh}')" class="p-3 text-sm sm:text-base font-extrabold rounded-xl border-2 text-left transition ${slide3PresetTopic === t.zh ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'}">
                      ${t[currentLang]}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block font-black text-slate-900 text-lg sm:text-xl mb-3">2. 選擇情感 Emotion Preset</label>
                <div class="grid grid-cols-2 gap-3">
                  ${emotionOptions.map(e => `
                    <button onclick="setSlide3Emotion('${e.zh}')" class="p-3 text-sm sm:text-base font-extrabold rounded-xl border-2 text-left transition ${slide3PresetEmotion === e.zh ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'}">
                      ${e[currentLang]}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Output Box -->
            <div class="bg-slate-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl flex flex-col justify-between space-y-4">
              <div>
                <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-3">
                  <span class="font-extrabold text-amber-400 text-lg sm:text-xl">🎯 生成的歌詞 Prompt</span>
                  <button onclick="copyToClipboard(document.getElementById('slide3-prompt-out').innerText)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm sm:text-base rounded-xl transition">
                    📋 Copy Prompt
                  </button>
                </div>
                <pre id="slide3-prompt-out" class="font-mono text-base sm:text-lg bg-slate-950 p-5 rounded-xl text-slate-200 whitespace-pre-wrap border border-slate-800 leading-relaxed">${generatedPrompt}</pre>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- SLIDE 11 COVER BUILDER HELPER ---
    function renderSlide11CoverBuilder(data) {
      const artStyles = ['Cyberpunk Neon', 'Retro City Pop', 'Warm Watercolor', 'Minimalist Line Art'];
      const moods = ['Golden Hour Glow', 'Midnight Neon', 'Soft Pastel Mood', 'Cinematic Dramatic'];

      const generatedCoverPrompt = `Album cover art for a Cantopop song, style: ${slide11ArtStyle}, mood: ${slide11Mood}, Hong Kong urban aesthetics, aesthetic typography space, 8k resolution, ultra-detailed --ar 1:1`;

      return `
        <div class="space-y-8">
          <div class="border-b-2 border-slate-200 pb-4">
            <h2 class="text-3xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight">${data.title[currentLang]}</h2>
            <p class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-600 mt-2">${data.subtitle[currentLang]}</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl p-6 sm:p-8 border-2 border-slate-200 shadow-md space-y-6">
              <div>
                <label class="block font-black text-slate-900 text-lg sm:text-xl mb-3">1. 藝術風格 Art Style</label>
                <div class="grid grid-cols-2 gap-3">
                  ${artStyles.map(s => `
                    <button onclick="setSlide11Style('${s}')" class="p-3 text-sm sm:text-base font-extrabold rounded-xl border-2 text-left transition ${slide11ArtStyle === s ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'}">
                      ${s}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block font-black text-slate-900 text-lg sm:text-xl mb-3">2. 光影氛圍 Mood & Lighting</label>
                <div class="grid grid-cols-2 gap-3">
                  ${moods.map(m => `
                    <button onclick="setSlide11Mood('${m}')" class="p-3 text-sm sm:text-base font-extrabold rounded-xl border-2 text-left transition ${slide11Mood === m ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100'}">
                      ${m}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="bg-slate-900 rounded-2xl p-6 sm:p-8 text-white shadow-xl flex flex-col justify-between space-y-4">
              <div>
                <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-3">
                  <span class="font-extrabold text-amber-400 text-lg sm:text-xl">🖼️ 封面 Prompt (Midjourney / DALL-E)</span>
                  <button onclick="copyToClipboard(document.getElementById('slide11-prompt-out').innerText)" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm sm:text-base rounded-xl transition">
                    📋 Copy Prompt
                  </button>
                </div>
                <code id="slide11-prompt-out" class="block font-mono text-base sm:text-lg bg-slate-950 p-5 rounded-xl text-emerald-400 border border-slate-800 break-words leading-relaxed">${generatedCoverPrompt}</code>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // --- DRAWER MENU RENDER ---
    function renderDrawerMenu() {
      const listContainer = document.getElementById('menu-list');
      listContainer.innerHTML = slideData.map((s, idx) => `
        <button onclick="goToSlide(${idx}); toggleMenu();" class="w-full text-left p-3 rounded-xl transition font-extrabold text-base sm:text-lg flex items-center space-x-3 ${idx === currentSlide ? 'bg-indigo-50 text-indigo-700 border-2 border-indigo-300' : 'hover:bg-slate-100 text-slate-800'}">
          <span class="font-mono text-xs sm:text-sm px-2.5 py-1 rounded-lg bg-slate-200 text-slate-900 font-black">${idx + 1}</span>
          <span class="truncate">${s.title[currentLang]}</span>
        </button>
      `).join('');
    }

    // --- STATE INTERACTION HANDLERS ---
    function setSlide3Topic(topic) { slide3PresetTopic = topic; renderSlide(); }
    function setSlide3Emotion(emotion) { slide3PresetEmotion = emotion; renderSlide(); }
    function toggleSlide6Check(idx) { slide6Checklist[idx] = !slide6Checklist[idx]; renderSlide(); }
    function setSlide11Style(style) { slide11ArtStyle = style; renderSlide(); }
    function setSlide11Mood(mood) { slide11Mood = mood; renderSlide(); }
    function toggleInstructorCheck(idx) { slide13InstructorChecks[idx] = !slide13InstructorChecks[idx]; renderSlide(); }
    function toggleStudentCheck(idx) { slide13StudentChecks[idx] = !slide13StudentChecks[idx]; renderSlide(); }

    // --- NAVIGATION LOGIC ---
    function nextSlide() {
      if (currentSlide < slideData.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < slideData.length) {
        currentSlide = idx;
        renderSlide();
      }
    }

    // --- LANGUAGE TOGGLE ---
    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('lang-indicator').innerText = currentLang === 'zh' ? '🌐 繁體中文' : '🌐 English';
      
      // Update Persistent UI Elements
      document.getElementById('txt-header-title').innerText = currentLang === 'zh' ? 'AI 廣東歌創作體驗班' : 'AI Cantonese Song Creation Workshop';
      document.getElementById('txt-menu-btn').innerText = currentLang === 'zh' ? '選單' : 'Menu';
      document.getElementById('txt-notes-btn').innerText = currentLang === 'zh' ? '備課筆記 (N)' : 'Notes (N)';
      document.getElementById('txt-notes-header').innerText = currentLang === 'zh' ? '導師備課與教學提醒' : 'Instructor Teaching Notes';
      document.getElementById('txt-drawer-title').innerText = currentLang === 'zh' ? '簡報章節目錄' : 'Slide Contents';
      document.getElementById('txt-prev').innerText = currentLang === 'zh' ? '上一頁' : 'Previous';
      document.getElementById('txt-next').innerText = currentLang === 'zh' ? '下一頁' : 'Next';
      document.getElementById('txt-slide-label').innerText = currentLang === 'zh' ? '簡報' : 'Slide';
      document.getElementById('txt-timer-preset-title').innerText = currentLang === 'zh' ? '設置倒數計時' : 'Timer Presets';
      document.getElementById('toast-text').innerText = currentLang === 'zh' ? '已成功複製到剪貼簿！' : 'Copied to clipboard!';

      renderSlide();
    }

    // --- TIMER UTILITY ---
    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const secs = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-toggle-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = '▶ Start';
        btn.className = 'px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-bold text-xs sm:text-sm hover:bg-indigo-700 transition shadow';
      } else {
        if (timerSeconds <= 0) timerSeconds = 300; // default 5m
        isTimerRunning = true;
        btn.innerText = '⏸ Pause';
        btn.className = 'px-3 py-1.5 bg-amber-600 text-white rounded-lg font-bold text-xs sm:text-sm hover:bg-amber-700 transition shadow';
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isTimerRunning = false;
            btn.innerText = '▶ Start';
            btn.className = 'px-3 py-1.5 bg-indigo-600 text-white rounded-lg font-bold text-xs sm:text-sm hover:bg-indigo-700 transition shadow';
            alert('⏱ 時間到！Time is up!');
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 0;
      updateTimerDisplay();
      document.getElementById('timer-toggle-btn').innerText = '▶ Start';
    }

    function setTimerPreset(sec) {
      resetTimer();
      timerSeconds = sec;
      updateTimerDisplay();
      document.getElementById('timer-dropdown').classList.add('hidden');
    }

    function toggleTimerMenu() {
      document.getElementById('timer-dropdown').classList.toggle('hidden');
    }

    // --- DRAWER & NOTES TOGGLES ---
    function toggleMenu() {
      document.getElementById('menu-drawer').classList.toggle('hidden');
    }

    function toggleNotes() {
      notesOpen = !notesOpen;
      const panel = document.getElementById('notes-panel');
      if (notesOpen) {
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    }

    // --- COPY TO CLIPBOARD ---
    function copyToClipboard(text) {
      if (!text) return;
      const el = document.createElement('textarea');
      el.value = text;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);

      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    // --- CONFETTI LAUNCHER ---
    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 90,
          origin: { y: 0.6 }
        });
      }
    }

    // --- KEYBOARD SHORTCUTS ---
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowRight' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 'm' || e.key === 'M') {
        toggleMenu();
      } else if (e.key === 'n' || e.key === 'N') {
        toggleNotes();
      }
    });

    // --- INITIALIZE ON LOAD ---
    window.onload = function () {
      renderSlide();
      updateTimerDisplay();
    };
  </script>
</body>
</html>
